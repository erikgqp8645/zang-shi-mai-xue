<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>设计方向 · 三版初稿</title>
<style>
  :root{
    --bg:#f7f4ee;--ink:#242220;--ink2:#55514b;--ink3:#8b857c;--line:#e0d9cb;--accent:#2f4f4a;
    --sans:-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);padding:24px 18px 48px}
  .wrap{max-width:720px;margin:0 auto}
  h1{font-size:20px;margin:0 0 6px}
  .sub{font-size:13px;color:var(--ink3);margin:0 0 22px;line-height:1.7}
  a.card{
    display:block;background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;margin-bottom:12px;text-decoration:none;color:inherit;
  }
  a.card:active{background:#faf8f3}
  .k{font-size:11px;color:var(--ink3);letter-spacing:.08em}
  .t{font-size:16px;font-weight:600;margin:3px 0 4px}
  .d{font-size:13px;color:var(--ink2);line-height:1.7;margin:0}
  .go{float:right;color:var(--accent);font-size:13px;margin-top:-2px}
  .foot{margin-top:20px;font-size:12px;color:var(--ink3);line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
  <h1>三个方向 · 初稿</h1>
  <p class="sub">同一份真实内容（示例·少娟 / 5 次记录 / 命中 35 条），三种不同的骨架。<br>点开任一版，桌面和手机都能看。</p>

  <a class="card" href="dir-1.html">
    <span class="go">打开 ›</span>
    <div class="k">方向一</div>
    <div class="t">医案册页</div>
    <p class="d">竖排书眉＋病案纸表格＋右侧朱批式判读。安静、像纸本病案；判读以批注形式贴在手边。</p>
  </a>

  <a class="card" href="dir-2.html">
    <span class="go">打开 ›</span>
    <div class="k">方向二</div>
    <div class="t">诊台</div>
    <p class="d">中性白底、表格是主角，判读常驻右栏，底部一条三部曲。克制、信息密度高，适合每天大量录入。</p>
  </a>

  <a class="card" href="dir-3.html">
    <span class="go">打开 ›</span>
    <div class="k">方向三</div>
    <div class="t">分步向导</div>
    <p class="d">手机优先：一屏一步，寸关尺拆成三组大卡，点格子录符号。上手快，单手可操作。</p>
  </a>

  <p class="foot">示例数据，非真实病例 · 本工具只做记录，不构成诊断</p>
</div>
</body>
</html>
